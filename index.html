<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="description" content="Ngs Transportes Logística Terrestre | Entregas Last Mile, Cross-Docking, Fulfillment e Transporte Rodoviário em todo o Brasil." />
    <meta name="theme-color" content="#FFD80F" />
    <title>Ngs Transportes — Logística Terrestre & Last Mile</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ngs-portal-theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
